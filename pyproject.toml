[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016 Assignment 2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasketch==2.0.0",
    "fastapi==0.162.7",
    "httpx==0.28.1",
    "langchain-core==1.8.0",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.8.0",
    "langgraph==1.2.21",
    "mcp==1.30.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.8",
    "tenacity==9.2.1",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
data = [
    "kaggle==2.2.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
    "syrupy==7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "data", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "gigsim/tests", "mcp_servers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["ignore::langchain_core._api.beta_decorator.LangChainBetaWarning"]
