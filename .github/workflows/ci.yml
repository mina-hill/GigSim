name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      MODEL_PROFILE: test
      LLM_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Unit, contract and integration tests
        run: uv run pytest -q
      - name: GigSim unchanged since freeze
        run: uv run python -m scripts.ci.check_gigsim_frozen
      - name: Tables in README and report match evals/results
        run: uv run python -m scripts.make_tables --check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          (cd ../.. && uv sync --locked && uv run python -m apps.api.export_openapi --output apps/web/openapi.json)
          npm run gen:api
          git diff --exit-code -- src/lib/api openapi.json
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Browser tests against GigSim
        env:
          GIGSIM_DB_URL: sqlite:///${{ runner.temp }}/gigsim-web.sqlite
          GIGBID_WEB_CHECKPOINT: ${{ runner.temp }}/gigbid-web.sqlite
          GIGSIM_BASE_URL: http://127.0.0.1:8081
          GIGSIM_ERROR_RATE: "0"
          GIGSIM_LATENCY_MS_MAX: "0"
          GIGSIM_ADMIN_TOKEN: gigbid-ci-admin
        run: |
          (cd ../.. && uv run python -m gigsim.seed --world gigsim/fixtures/mini_world)
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/
          if [ -d public ]; then
            mkdir -p .next/standalone/public
            cp -r public/. .next/standalone/public/
          fi

          (cd ../.. && exec uv run uvicorn gigsim.app:app --port 8081) > "$RUNNER_TEMP/gigsim.log" 2>&1 &
          simulator=$!
          (cd ../.. && exec uv run uvicorn apps.api.main:app --port 8000) > "$RUNNER_TEMP/gigbid-api.log" 2>&1 &
          api=$!
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > "$RUNNER_TEMP/gigbid-web.log" 2>&1 &
          web=$!
          trap 'kill "$web" "$api" "$simulator" 2>/dev/null || true' EXIT

          curl --retry 25 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://127.0.0.1:8081/health
          curl --retry 25 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://127.0.0.1:8000/health
          curl --retry 25 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://127.0.0.1:3000/health/deps
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            ${{ runner.temp }}/gig*.log

  hosted-reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the reviewer image
        run: docker build -f infra/docker/reviewer.Dockerfile -t gigsim-reviewer:ci .
      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium --only-shell
      - name: Exercise reviewer authentication, persistence and approval
        run: |
          export GIGBID_LIVE_URL=http://127.0.0.1:10000
          export GIGBID_REVIEWER_USER=reviewer
          GIGBID_REVIEWER_PASSWORD=$(openssl rand -hex 16)
          export GIGBID_REVIEWER_PASSWORD
          echo "::add-mask::$GIGBID_REVIEWER_PASSWORD"
          GIGBID_REVIEWER_HASH=$(docker run --rm --entrypoint caddy gigsim-reviewer:ci \
            hash-password --plaintext "$GIGBID_REVIEWER_PASSWORD")
          export GIGBID_REVIEWER_HASH
          echo "::add-mask::$GIGBID_REVIEWER_HASH"

          docker volume create gigsim-reviewer-ci-state
          trap 'docker logs gigsim-reviewer-ci; docker rm -f gigsim-reviewer-ci; docker volume rm gigsim-reviewer-ci-state' EXIT
          docker run --detach --name gigsim-reviewer-ci --memory 512m --cpus 0.5 \
            --publish 127.0.0.1:10000:10000 --mount source=gigsim-reviewer-ci-state,target=/var/lib/gigbid \
            --env GIGBID_REVIEWER_USER --env GIGBID_REVIEWER_HASH gigsim-reviewer:ci

          wait_for_health() {
            curl --fail --silent --show-error --retry 40 --retry-delay 2 --retry-all-errors \
              "$GIGBID_LIVE_URL/healthz" >/dev/null
          }
          wait_for_health
          url="$GIGBID_LIVE_URL/api/v1/jobs/job_web_stripe/run?persona=fullstack"
          auth="$GIGBID_REVIEWER_USER:$GIGBID_REVIEWER_PASSWORD"
          before=$(curl -fsS --user "$auth" -H 'Sec-Fetch-Site: same-origin' -X POST "$url" | jq -er .pending.proposal_digest)
          docker restart gigsim-reviewer-ci
          wait_for_health
          after=$(curl -fsS --user "$auth" "$url" | jq -er .pending.proposal_digest)
          test "$before" = "$after"

          cd apps/web
          npx playwright test --config=playwright.hosted.config.ts
