name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      MODEL_PROFILE: test
      LLM_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Unit, contract and integration tests
        run: uv run pytest -q
      - name: GigSim unchanged since freeze
        run: uv run python -m scripts.ci.check_gigsim_frozen
      - name: Tables in README and report match evals/results
        run: uv run python -m scripts.make_tables --check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          (cd ../.. && uv sync --frozen && uv run python -m apps.api.export_openapi > apps/web/openapi.json)
          npm run gen:api
          git diff --exit-code -- src/lib/api openapi.json
      - run: npm run lint
      - run: npm run build
