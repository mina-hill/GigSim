name: eval
# Deterministic 30-job development sample using the offline graph and synthetic data.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - name: Smoke eval (30 jobs) with gates
        run: |
          uv run python -m evals.runners.smoke --jobs 30 --gate --output "$RUNNER_TEMP/bid-smoke.report.json"
          diff -u evals/results/bid-smoke.report.json "$RUNNER_TEMP/bid-smoke.report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-eval
          path: ${{ runner.temp }}/bid-smoke.report.json
